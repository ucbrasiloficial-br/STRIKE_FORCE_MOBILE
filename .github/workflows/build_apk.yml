name: Build APK Android - STRIKE FORCE MOBILE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_HOME: "/usr/local/lib/android/sdk"

jobs:
  build-android-apk:
    name: Validar & Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Preparar Android SDK e Aceitar Licenças
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          CMDLINE_BIN=$(find "${ANDROID_HOME}/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          if [ -z "${CMDLINE_BIN}" ]; then
            mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip -d "${ANDROID_HOME}/cmdline-tools/latest"
            if [ -d "${ANDROID_HOME}/cmdline-tools/latest/cmdline-tools" ]; then
              mv "${ANDROID_HOME}/cmdline-tools/latest/cmdline-tools"/* "${ANDROID_HOME}/cmdline-tools/latest/"
              rmdir "${ANDROID_HOME}/cmdline-tools/latest/cmdline-tools"
            fi
            CMDLINE_BIN="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "${CMDLINE_BIN}"
          yes | "${CMDLINE_BIN}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null 2>&1 || true
          yes | "${CMDLINE_BIN}" --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: 4. Instalar Godot 4.3 Headless e Templates Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: 5. Gerar Debug Keystore para Assinatura APK
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=StrikeForce,O=Android,C=BR" -validity 9999

      - name: 6. Configurar Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: 7. Importar Recursos e Validar Projeto
        run: |
          godot --headless --path . --import
          godot --headless --path . --script res://tests/validate_project.gd

      - name: 8. Exportar APK Android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/strike_force_mobile.apk
          ls -lh build/strike_force_mobile.apk

      - name: 9. Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STRIKE_FORCE_MOBILE_APK
          path: build/strike_force_mobile.apk
          retention-days: 30
          
