name: Descompactar Projeto ZIP (Sem Alterar Workflows)

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Repositório
        uses: actions/checkout@v4

      - name: 2. Descompactar ZIP na Raiz do Projeto
        run: |
          if [ -f "STRIKE_FORCE_MOBILE.zip" ]; then
            unzip -o STRIKE_FORCE_MOBILE.zip -d tmp_extract
            if [ -d "tmp_extract/STRIKE_FORCE_MOBILE" ]; then
              cp -rf tmp_extract/STRIKE_FORCE_MOBILE/. .
            else
              cp -rf tmp_extract/. .
            fi
            rm -rf tmp_extract STRIKE_FORCE_MOBILE.zip
          else
            echo "Nenhum STRIKE_FORCE_MOBILE.zip encontrado."
            exit 0
          fi

      - name: 3. Ignorar .github/workflows no Push e Comitar Arquivos do Jogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD -- .github/workflows 2>/dev/null || true
          git checkout -- .github/workflows 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: extrair arquivos do projeto STRIKE FORCE MOBILE"
          git push
